# Environment configuration for combined frontend and backend deployment (PRODUCTION)
# Used with multi-container pod deployment in .drone.yml

# Environment variables for main container (frontend)
env:
  NODE_ENV: production
  INTERNAL_API_URL: http://127.0.0.1:8000  # Frontend connects to backend via loopback (required for Istio)
  INTERNAL_WS_URL: ws://127.0.0.1:8000     # WebSocket connection via loopback
  NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000  # Public backend URL is loopback
  BACKEND_URL: http://127.0.0.1:8000

# Secrets for main container (frontend)
envSecrets:
  # MongoDB Configuration
  MONGO_URI: factory-mongodb-prod

  # PostgreSQL Configuration
  SQL_USERNAME: factory-mongodb-prod
  SQL_PASSWORD: factory-mongodb-prod
  SQL_HOSTNAME: factory-mongodb-prod
  SQL_DATABASE: factory-mongodb-prod

# Sidecar containers configuration
sidecarContainers:
  - name: backend
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-factory-backend-prod:latest
    ports:
      - containerPort: 8000
        name: backend
    env:
      - name: NODE_ENV
        value: production
      - name: BACKEND_URL
        value: http://127.0.0.1:8000
      - name: MONGO_URI
        valueFrom:
          secretKeyRef:
            name: factory-mongodb-prod
            key: MONGO_URI
      - name: SQL_USERNAME
        valueFrom:
          secretKeyRef:
            name: factory-mongodb-prod
            key: SQL_USERNAME
      - name: SQL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: factory-mongodb-prod
            key: SQL_PASSWORD
      - name: SQL_HOSTNAME
        valueFrom:
          secretKeyRef:
            name: factory-mongodb-prod
            key: SQL_HOSTNAME
      - name: SQL_DATABASE
        valueFrom:
          secretKeyRef:
            name: factory-mongodb-prod
            key: SQL_DATABASE

# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: javier.guajardo@mongodb.com
